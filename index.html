<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>-</title>
    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            position: fixed;
            pointer-events: none; /* تجميد تامة تمنع اللمس أو الرجوع */
        }
        /* شاشة ألوان ملخبطة ومرعبة بدون خطوط */
        #crazy-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #ff0055 0%, #00ffff 40%, #ffcc00 80%, #000 100%);
            animation: colorChaos 0.05s infinite linear, screenShake 0.08s infinite;
            z-index: 99999;
        }
        @keyframes colorChaos {
            0% { filter: invert(0) hue-rotate(0deg) scale(1); }
            50% { filter: invert(1) hue-rotate(180deg) scale(1.03); }
            100% { filter: invert(0) hue-rotate(360deg) scale(1); }
        }
        @keyframes screenShake {
            0% { transform: translate(5px, 5px); }
            50% { transform: translate(-5px, -5px); }
            100% { transform: translate(0, 0); }
        }
        /* الشاشة السوداء الميتة النهائية */
        #black-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000;
            display: none;
            z-index: 100000;
        }
    </style>
</head>
<body>

    <div id="crazy-screen"></div>
    <div id="black-screen"></div>

    <script>
        // منع أي محاولة للخروج أو الضغط
        window.onbeforeunload = function() { return "خطأ في النظام"; };

        // بعد 3 ثواني من التجميد والألوان، الشاشة تطفي وتصير سودة مطفية تماماً بدون أي حروف
        setTimeout(function() {
            document.getElementById("crazy-screen").style.display = "none";
            document.getElementById("black-screen").style.display = "block";
            if (navigator.vibrate) {
                navigator.vibrate([1500, 300, 1500, 300, 2000]);
            }
        }, 3000);
    </script>
</body>
</html>
